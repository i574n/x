name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xc-windows:
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "stable"

      - run: pwsh scripts/workflow.ps1 -Xc

      - uses: actions/upload-artifact@v5.0.0
        with:
          name: xc-windows
          path: target/release/xc.exe
          if-no-files-found: error

  build:
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "stable"

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20"
          gleam-version: "1.19.2"
          rebar3-version: '3.27.3'

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12.10"

      - run: pwsh scripts/workflow.ps1
