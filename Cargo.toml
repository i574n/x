[workspace]
resolver = "3"
members = ["apps/client/*"]
exclude = ["apps/client/e2e", "apps/client/simframes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/i574n/x"

[workspace.dependencies]
serde_json = "1.0"
ureq = "3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
