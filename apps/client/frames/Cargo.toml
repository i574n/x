[package]
name = "xc_frames"
version.workspace = true
edition.workspace = true
repository.workspace = true

[package.metadata.spiral]
entry = "frames.spi"
output = "frames.rs"

[lib]
name = "xc_frames"
path = "frames.rs"

[dependencies]
xc_cells = { path = "../cells" }
xc_chunks = { path = "../chunks" }
xc_posted = { path = "../posted" }
xc_weights = { path = "../weights" }
serde_json = { workspace = true }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
